<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh thanh cuộn cho mượt mà */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-gray-800 p-4 text-center border-b border-gray-700 shadow-md">
        <h1 class="text-xl font-bold text-blue-400 flex justify-center items-center gap-2">
            <span>🤖</span> AI Chatbot (Flask & Gemini)
        </h1>
    </header>

    <!-- Khung Chat -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6 max-w-3xl w-full mx-auto pb-6">
        <!-- Lời chào mặc định -->
        <div class="flex items-start space-x-3">
            <div class="bg-blue-600 text-white rounded-full h-8 w-8 flex-shrink-0 flex items-center justify-center font-bold text-xs shadow-lg">AI</div>
            <div class="bg-gray-800 p-3 rounded-lg max-w-[85%] text-sm leading-relaxed shadow border border-gray-700">
                Xin chào! Tôi đã được cấu hình lại chuẩn xác. Bạn có thể kiểm tra!
            </div>
        </div>
    </main>

    <!-- Khung Nhập liệu -->
    <footer class="bg-gray-800 p-4 border-t border-gray-700 shadow-inner">
        <form id="chat-form" class="max-w-3xl mx-auto flex gap-3">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Nhập tin nhắn..." 
                class="flex-1 bg-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm border border-gray-600 transition"
                autocomplete="off"
                required
            >
            <button 
                type="submit" 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-medium transition text-sm flex items-center justify-center shadow-lg w-24">
                Gửi
            </button>
        </form>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="animate-pulse">...</span>';

            const loadingId = appendMessage('AI đang suy nghĩ...', 'ai', true);

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove();

                if (data.response) {
                    appendMessage(data.response, 'ai');
                } else {
                    appendMessage('❌ Lỗi: ' + (data.error || 'Lỗi không xác định'), 'ai');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('❌ Lỗi kết nối tới server Python.', 'ai');
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = 'Gửi';
                userInput.focus();
            }
        });

        function appendMessage(text, sender, isLoading = false) {
            const messageId = 'msg-' + Date.now();
            const isUser = sender === 'user';
            
            const messageDiv = document.createElement('div');
            messageDiv.id = messageId;
            messageDiv.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''} animate-fade-in`;

            // Style format cho tin nhắn
            let formattedText = escapeHtml(text);
            if (!isUser) {
                // Đổi \n thành thẻ <br> để hiển thị đúng xuống dòng
                formattedText = formattedText.replace(/\n/g, '<br>');
            }

            messageDiv.innerHTML = `
                <div class="${isUser ? 'bg-green-600' : 'bg-blue-600'} text-white rounded-full h-8 w-8 flex-shrink-0 flex items-center justify-center font-bold text-xs shadow-lg">
                    ${isUser ? 'You' : 'AI'}
                </div>
                <div class="${isUser ? 'bg-green-700' : 'bg-gray-800'} p-3 rounded-lg max-w-[85%] text-sm leading-relaxed shadow border ${isUser ? 'border-green-600' : 'border-gray-700'} ${isLoading ? 'italic text-gray-400' : ''}">
                    ${formattedText}
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            return messageId;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
